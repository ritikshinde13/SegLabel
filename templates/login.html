<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Access — SegLabel Security Command Center</title>
    
    <!-- Modern Typography: Poppins & Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Montserrat:wght@500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Login Specific Styles -->
    <link rel="stylesheet" href="/static/css/login.css">
</head>
<body>
    <!-- Background Canvas & Cyber Ambient Mesh -->
    <canvas id="cyberMatrixCanvas"></canvas>
    <div class="ambient-glow-sphere glow-cyan"></div>
    <div class="ambient-glow-sphere glow-blue"></div>

    <!-- Top Command Center Indicator -->
    <div class="top-system-indicator" id="topIndicator">
        <span class="indicator-pulse-dot"></span>
        <span>SECURE ACCESS // SEGMENTATION CONTROL CENTER</span>
    </div>

    <!-- Main Viewport Center -->
    <div class="login-viewport">
        <div class="login-card-wrapper">
            <div class="login-card" id="loginCard">
                
                <!-- Card Header -->
                <div class="login-header">
                    <div class="brand-emblem-wrap" id="brandEmblem">
                        <!-- Futuristic Shield / Circuit Hexagon SVG -->
                        <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                            <polygon points="20,3 36,12 36,28 20,37 4,28 4,12" stroke="#2563EB" stroke-width="2.2" fill="rgba(37, 99, 235, 0.08)"/>
                            <polygon points="20,8 31,14 31,26 20,32 9,26 9,14" stroke="rgba(37, 99, 235, 0.4)" stroke-width="1.2" fill="none"/>
                            <circle cx="20" cy="20" r="4" fill="#2563EB"/>
                            <line x1="20" y1="8" x2="20" y2="16" stroke="#2563EB" stroke-width="1.5"/>
                            <line x1="20" y1="24" x2="20" y2="32" stroke="#2563EB" stroke-width="1.5"/>
                            <line x1="9" y1="20" x2="16" y2="20" stroke="#2563EB" stroke-width="1.5"/>
                            <line x1="24" y1="20" x2="31" y2="20" stroke="#2563EB" stroke-width="1.5"/>
                        </svg>
                    </div>
                    <div class="brand-title">
                        SEG<span class="cyan-glow">Label</span>
                    </div>
                    <div class="brand-subtitle">Workload Identity Security Platform</div>
                    
                    <div class="security-connection-status" id="securityStatus">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                        </svg>
                        <span>SECURE CONNECTION</span>
                    </div>
                </div>

                <!-- Headings -->
                <div class="heading-group">
                    <h1 class="login-heading">Secure Access</h1>
                    <p class="login-desc">Authenticate to access the SegLabel Security Command Center.</p>
                </div>

                <!-- Feedback Banner -->
                <div id="authFeedbackBanner" class="auth-feedback-banner {% if error %}error{% endif %}" role="alert">
                    {% if error %}{{ error }}{% endif %}
                </div>

                <!-- Form -->
                <form id="loginForm" method="POST" action="/login" class="login-form">
                    <input type="hidden" name="next" value="{{ next or '/' }}">

                    <!-- Username / Email Field -->
                    <div class="form-group-cyber">
                        <label for="usernameInput" class="form-label-cyber">
                            <span>Username / Operator ID</span>
                        </label>
                        <div class="input-container">
                            <svg class="input-icon-prefix" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                <circle cx="12" cy="7" r="4"/>
                            </svg>
                            <input 
                                type="text" 
                                id="usernameInput" 
                                name="username" 
                                class="form-input-cyber" 
                                placeholder="Enter username (e.g. admin)" 
                                autocomplete="username" 
                                required
                                spellcheck="false">
                        </div>
                    </div>

                    <!-- Password Field -->
                    <div class="form-group-cyber">
                        <label for="passwordInput" class="form-label-cyber">
                            <span>Password</span>
                        </label>
                        <div class="input-container">
                            <svg class="input-icon-prefix" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                            </svg>
                            <input 
                                type="password" 
                                id="passwordInput" 
                                name="password" 
                                class="form-input-cyber" 
                                placeholder="Enter security passphrase" 
                                autocomplete="current-password" 
                                required>
                            <button 
                                type="button" 
                                id="btnTogglePassword" 
                                class="btn-toggle-password" 
                                aria-label="Show password" 
                                title="Toggle password visibility">
                                <!-- Eye Icon -->
                                <svg id="iconEye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                                <!-- Eye Off Icon (hidden initially) -->
                                <svg id="iconEyeOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: none;">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                                    <line x1="1" y1="1" x2="23" y2="23"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- Remember Me Option -->
                    <div class="form-options-row">
                        <label class="checkbox-label-cyber" for="rememberMe">
                            <input type="checkbox" id="rememberMe" name="remember_me" class="checkbox-cyber">
                            <span>Keep me signed in</span>
                        </label>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" id="btnSignIn" class="btn-cyber-auth">
                        <span class="auth-spinner" id="authSpinner"></span>
                        <span id="btnSignInText">Sign In</span>
                    </button>

                    <!-- Quick Demo Credentials Tip Pill -->
                    <div class="demo-credentials-pill">
                        <div>Demo: <strong>admin</strong> / <strong>SegLabel@2026!</strong></div>
                        <button type="button" class="btn-quick-fill" id="btnQuickFill" title="Autofill demo credentials">Autofill</button>
                    </div>
                </form>

                <!-- Footer -->
                <div class="login-card-footer">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                        <polyline points="9 12 11 14 15 10"/>
                    </svg>
                    <span>Protected by SegLabel Security Engine</span>
                </div>

            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/static/js/anime.min.js"></script>
    <script src="/static/js/login.js"></script>
</body>
</html>
